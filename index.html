  html, body { height: 100%; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  button, input, textarea { touch-action: manipulation; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 앱 셸: 화면 전체를 채우고, 헤더는 고정, 본문만 스크롤 */
  .app { height: 100%; display: flex; flex-direction: column; background: var(--paper); }
  .screen:not([hidden]) { display: flex; flex-direction: column; flex: 1; min-height: 0; animation: slide-in .22s ease; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 4px 16px 48px; }

  /* 데스크톱에서 열었을 때만 스마트폰 크기의 프레임으로 표시 */
  @media (min-width: 640px) {
    body { background: var(--bg); display: flex; align-items: center; justify-content: center; }
    .app { width: 390px; height: min(844px, calc(100% - 48px)); border: 2px solid var(--ink); border-radius: 44px; overflow: hidden; }
    .top { padding-top: 28px; }
  }
  @keyframes slide-in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

  .top { flex: none; display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 12px 16px 8px; background: var(--paper); }
  .brand { margin: 0; font: 700 42px/1 var(--display); letter-spacing: .01em; text-wrap: balance; }
  .back { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; margin-left: -8px; }
  .back:hover { background: var(--chip); }

  /* 홈 */
  #home, #album { position: relative; }
  #home .top, #home .scroll, #album .top, #album .scroll { position: relative; z-index: 1; }
  #home .top, #album .top { background: transparent; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .2; pointer-events: none; z-index: 0; }
  .dest { display: block; width: 100%; margin-top: 12px; padding: 6px 2px; border: 0; border-bottom: 3px solid var(--ink); border-radius: 0; background: transparent; color: var(--ink); font: 700 30px/1.2 var(--display); }
  .dest::placeholder { color: var(--ink); opacity: 1; }
  .dest:focus { outline: none; border-bottom-color: var(--accent); }

  .grid { display: grid; grid-template-columns: 30px minmax(0, 1.25fr) minmax(0, 1fr) 40px 28px; gap: 8px; align-items: center; }
  .head { margin-top: 20px; font: 700 20px/1 var(--display); text-align: center; }
  .row { padding-block: 6px; }
  .no { font: 700 22px/1 var(--display); text-align: center; font-variant-numeric: tabular-nums; }
  .row input, .row textarea { width: 100%; min-width: 0; padding: 8px 2px; border: 0; border-bottom: 2px solid var(--rule); border-radius: 0; background: transparent; color: var(--ink); font: 16px/1.3 var(--body); text-align: center; }
  .row input::placeholder, .row textarea::placeholder { color: var(--muted); opacity: .85; }
  .row input:focus, .row textarea:focus { outline: none; border-bottom-color: var(--accent); }
  .row textarea { display: block; resize: none; overflow: hidden; font-size: 15px; line-height: 1.35; }
  .go { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .go:active { transform: scale(.94); }
  .del { width: 28px; height: 40px; border-radius: 8px; color: var(--muted); font-size: 22px; line-height: 1; }
  .del.armed { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); }

  .addtrip { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 4px; border-radius: 12px; color: var(--muted); font-size: 15px; }
  .circle { width: 36px; height: 36px; border: 2px solid var(--ink); border-radius: 50%; display: grid; place-items: center; color: var(--ink); font: 700 26px/1 var(--display); }
  .quote { flex: none; position: relative; z-index: 2; padding: 10px 20px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px dashed var(--rule); background: var(--paper); text-align: center; }
  .quote { --qc: #C2410C; border-top: 2px solid var(--qc); }
  .quote p { margin: 0; color: var(--qc); font: 700 20px/1.45 var(--display); letter-spacing: .01em; word-break: keep-all; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .quote { --qc: #FF9A5C; } }
  :root[data-theme="dark"] .quote { --qc: #FF9A5C; }
  .none { margin: 28px 0 0; color: var(--muted); text-align: center; }

  /* 앨범 */
  .stub { white-space: pre-line; margin: 10px 0 0; padding: 8px 2px 10px; border-bottom: 2px dashed var(--hair); font: 700 19px/1.2 var(--display); color: var(--muted); overflow-wrap: anywhere; }
  .stub b { color: var(--ink); font-weight: 700; }
  .stub span { display: block; }
  .stub .l1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .days { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .chip { padding: 6px 16px; border: 2px solid var(--hair); border-radius: 12px; color: var(--muted); font: 700 22px/1.2 var(--display); }
  .chip.on { border: 3px solid var(--ink); padding: 5px 15px; color: var(--ink); background: var(--chip); }
  .chip.plus { border-style: dashed; }

  .memo { display: block; width: 100%; min-height: 104px; margin-top: 16px; padding: 14px 16px; border: 2px solid var(--ink); border-radius: 22px; background: transparent; color: var(--ink); font: 16px/1.6 var(--body); resize: none; overflow: hidden; }
  .memo::placeholder, .cap::placeholder { color: var(--muted); opacity: .9; }
  .memo:focus, .cap:focus { outline: none; border-color: var(--accent); }

  .sec { display: flex; align-items: baseline; justify-content: space-between; margin-top: 26px; padding: 0 2px 4px; border-bottom: 3px solid var(--ink); }
  .sec h2 { margin: 0; font: 700 28px/1.2 var(--display); }
  .sec span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

  .clips { display: grid; gap: 16px; margin-top: 18px; }
  .clip { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: start; }
  .thumb { position: relative; width: 112px; height: 112px; border: 2px solid var(--ink); border-radius: 18px; overflow: hidden; background: var(--chip); }
  .thumb img, .thumb video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .thumb video { background: #000; }
  .thumb .x { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; background: rgba(20, 32, 51, .62); color: #fff; font-size: 18px; line-height: 1; }
  .thumb .x.armed { background: var(--danger); }
  .cap { display: block; width: 100%; min-height: 112px; padding: 10px 12px; border: 1.5px solid var(--hair); border-radius: 14px; background: transparent; color: var(--ink); font: 15px/1.55 var(--body); resize: none; }
  .plus-box { width: 112px; height: 112px; border: 2px solid var(--ink); border-radius: 18px; font: 700 21px/1.25 var(--display); text-align: center; display: grid; place-items: center; }
  .plus-box:active { transform: scale(.97); }
  .hint { align-self: end; color: var(--muted); font-size: 13px; }

  .delday { display: block; margin: 36px auto 0; padding: 8px 12px; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; border-radius: 8px; }
  .delday.armed { color: var(--danger); }

  .thumb { cursor: zoom-in; }
  .thumb .x { z-index: 2; }
  .thumb.vid::before { content: ''; position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: rgba(20, 32, 51, .6); z-index: 1; }
  .thumb.vid::after { content: ''; position: absolute; left: 50%; top: 50%; margin: -8px 0 0 -5px; border-style: solid; border-width: 8px 0 8px 14px; border-color: transparent transparent transparent #fff; z-index: 1; }

  .viewer { display: none; position: fixed; inset: 0; z-index: 20; flex-direction: column; align-items: center; background: rgba(5, 10, 18, .94); padding: calc(64px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .viewer:not([hidden]) { display: flex; }
  .vstage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .vstage img, .vstage video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
  .vcap { margin: 12px 0 0; max-width: 520px; color: #E9EFF7; font-size: 15px; line-height: 1.5; text-align: center; white-space: pre-line; }
  .vcap:empty { display: none; }
  .vclose { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, .16); color: #fff; font-size: 28px; line-height: 1; }

  .top .brand { flex: 1; min-width: 0; }
  .menu { position: relative; margin-left: auto; flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
  .menu:hover { background: var(--chip); }
  .dot { position: absolute; top: 9px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); }
  .dot[hidden] { display: none; }

  .dlg { display: none; position: fixed; inset: 0; z-index: 30; align-items: center; justify-content: center; padding: 20px 16px; background: rgba(5, 10, 18, .6); }
  .dlg:not([hidden]) { display: flex; }
  .dlg .card { width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto; padding: 20px; border: 2px solid var(--ink); border-radius: 24px; background: var(--paper); color: var(--ink); }
  .dlg h2 { margin: 0 0 8px; font: 700 28px/1.2 var(--display); }
  .dlg .note, .dlg .info { margin: 0 0 10px; font-size: 14px; line-height: 1.6; }
  .dlg .info { font-weight: 700; }
  .acts { display: grid; gap: 10px; margin: 14px 0 4px; }
  .btn { width: 100%; padding: 13px 16px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-size: 16px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); padding: 11px 16px; }
  .btn.danger { background: var(--danger); color: #fff; }
  .dlg .msg { min-height: 1.5em; margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: var(--accent); }
  .dlg .ver { margin: 8px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
  .dlg .plain { display: block; margin: 8px auto 0; padding: 8px 12px; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; border-radius: 8px; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); max-width: calc(100% - 32px); padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 40; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .screen:not([hidden]) { animation: none; }
    .toast { transition: none; }
  }
</style>

    <header class="top">
      <button id="back" class="back" type="button" aria-label="홈으로">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 class="brand">Penny's Trip</h1>
    </header>
    <div class="scroll">
    <p id="stub" class="stub"></p>
    <div id="days" class="days"></div>
    <textarea id="memo" class="memo" placeholder="여행지 등 간단한 내용..." aria-label="일차 메모" rows="3"></textarea>
    <div class="sec"><h2>클립</h2><span id="clipCount"></span></div>
    <div id="clips" class="clips"></div>
    <button id="addPhotoBtn" class="addtrip" type="button"><span class="circle" aria-hidden="true">+</span>사진/동영상 추가</button>
    <input id="file" type="file" accept="image/*,video/*" multiple hidden>
    <button id="delDay" class="delday" type="button" hidden>이 일차 삭제</button>
    </div>
  </section>
</main>
<div id="dlg" class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" hidden>
  <div class="card">
    <h2 id="dlgTitle">백업과 복원</h2>
    <p class="note">앱을 지우고 다시 설치하면 이 폰에 저장된 문구와 사진/동영상이 사라져요. 먼저 백업 파일을 저장해 두면, 다시 설치한 뒤 그대로 불러올 수 있어요.</p>
    <p id="dlgInfo" class="info"></p>
    <div id="dlgActions" class="acts"></div>
    <p id="dlgMsg" class="msg" role="status"></p>
    <button id="dlgClose" class="plain" type="button">닫기</button>
    <p class="ver">앱 버전 <span id="dlgVer"></span></p>
  </div>
  <input id="restoreFile" type="file" accept=".zip,application/zip" hidden>
</div>
<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="사진/동영상 보기" hidden>
  <button id="vclose" class="vclose" type="button" aria-label="닫기">×</button>
  <div id="vstage" class="vstage"></div>
  <p id="vcap" class="vcap"></p>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var S = null, cur = null, day = 0, saveTimer = null, canSave = true, warned = false;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* ---------- 저장 (이 기기 브라우저의 IndexedDB) ---------- */
  function idb() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('pennys-trip', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function dbGet(k) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var q = db.transaction('kv').objectStore('kv').get(k);
        q.onsuccess = function () { res(q.result); };
        q.onerror = function () { rej(q.error); };
      });
    });
  }
  function dbPut(k, v) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, k);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function dbDel(k) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete(k);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  /* 사진과 동영상 원본은 용량이 커서 문구 데이터와 따로 보관 (사진 p<번호>, 동영상 v<번호>) */
  var mediaUrls = {};
  function mkey(c) { return (c.kind === 'video' ? 'v' : 'p') + c.id; }
  function mediaUrl(key) {
    if (mediaUrls[key]) return Promise.resolve(mediaUrls[key]);
    return dbGet(key).then(function (blob) {
      if (!blob) return null;
      mediaUrls[key] = URL.createObjectURL(blob);
      return mediaUrls[key];
    }).catch(function () { return null; });
  }
  function dropMedia(clips) {
    clips.forEach(function (c) {
      if (c.kind !== 'video' && c.kind !== 'photo') return;
      var k = mkey(c);
      if (mediaUrls[k]) { URL.revokeObjectURL(mediaUrls[k]); delete mediaUrls[k]; }
      dbDel(k).catch(function () {});
    });
  }
  function flush() {
    clearTimeout(saveTimer);
    if (!canSave || !S) return;
    try {
      dbPut('state', S).catch(warn);
    } catch (e) { warn(); }
  }
  function warn() {
    if (warned) return; warned = true;
    toast('이 브라우저에서는 저장이 안 돼요. 새로고침하면 내용이 사라져요.');
  }
  function save() {
    if (S) { S.changedAt = Date.now(); updateDot(); }
    clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300);
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) flush(); });
  window.addEventListener('pagehide', flush);

  /* 저장 데이터 버전. 앱을 고쳐도 기존 데이터는 지우지 않고, 빠진 항목만 채워 넣는다.
     새 기능으로 항목이 늘어나면 여기에 기본값만 추가하면 된다. (DB 이름과 저장 키 'state'는 바꾸지 않는다) */
  var SCHEMA = 2;
  function migrate(v) {
    if (!v || !Array.isArray(v.trips)) return null;
    v.name = v.name || '';
    var max = 0;
    v.trips.forEach(function (t) {
      t.date = t.date || ''; t.place = t.place || '';
      if (!Array.isArray(t.days) || !t.days.length) t.days = [{ memo: '', clips: [] }];
      max = Math.max(max, t.id || 0);
      t.days.forEach(function (d) {
        d.memo = d.memo || '';
        if (!Array.isArray(d.clips)) d.clips = [];
        d.clips.forEach(function (c) { c.cap = c.cap || ''; max = Math.max(max, c.id || 0); });
      });
    });
    v.nextId = Math.max(v.nextId || 1, max + 1);
    v.schema = SCHEMA;
    return v;
  }
  function seed() {
    return { schema: SCHEMA, name: '', nextId: 2, trips: [{ id: 1, date: '2026. 10. 16. ~ 10. 18.', place: '제주', days: [{ memo: '', clips: [] }] }] };
  }
  function trip(id) { return S.trips.filter(function (t) { return t.id === id; })[0]; }
  function newTrip() { return { id: S.nextId++, date: '', place: '', days: [{ memo: '', clips: [] }] }; }

  /* ---------- 공통 ---------- */
  function show(name) {
    $('#home').hidden = name !== 'home';
    $('#album').hidden = name !== 'album';
    var sc = $('#' + name + ' .scroll'); if (sc) sc.scrollTop = 0;
  }
  function arm(btn, fn, msg) {
    if (btn.classList.contains('armed')) { fn(); return; }
    btn.classList.add('armed');
    toast(msg || '한 번 더 누르면 삭제돼요');
    setTimeout(function () { btn.classList.remove('armed'); }, 2500);
  }
  function fit(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 4) + 'px'; }

  /* ---------- 홈 ---------- */
  var SKIP = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 6l7 6-7 6z"/><path d="M11 6l7 6-7 6z"/><rect x="19" y="6" width="2.4" height="12" rx="1"/></svg>';

  function renderHome() {
    $('#tripName').value = S.name || '';
    var h = S.trips.map(function (t, i) {
      var n = i + 1;
      return '<div class="grid row" data-id="' + t.id + '">' +
        '<span class="no">' + n + '</span>' +
        '<textarea data-f="date" rows="2" placeholder="입력" aria-label="' + n + '번 일정">' + esc(t.date) + '</textarea>' +
        '<textarea data-f="place" rows="2" placeholder="입력" aria-label="' + n + '번 여행지">' + esc(t.place) + '</textarea>' +
        '<button class="go" type="button" data-act="open" aria-label="' + n + '번 앨범 열기">' + SKIP + '</button>' +
        '<button class="del" type="button" data-act="del" aria-label="' + n + '번 삭제">×</button>' +
      '</div>';
    }).join('');
    $('#rows').innerHTML = h || '<p class="none">아래 + 버튼으로 첫 여행을 추가해 보세요.</p>';
    fitRows();
    updateDot();
  }

  function fitRow(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
  function fitRows() { document.querySelectorAll('#rows textarea').forEach(fitRow); }
  window.addEventListener('resize', fitRows);

  $('#tripName').addEventListener('input', function (e) { S.name = e.target.value; save(); });

  $('#rows').addEventListener('input', function (e) {
    var r = e.target.closest('.row'), f = e.target.dataset.f;
    if (!r || !f) return;
    var t = trip(+r.dataset.id); if (!t) return;
    t[f] = e.target.value; save();
    if (e.target.tagName === 'TEXTAREA') fitRow(e.target);
  });
  $('#rows').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var r = b.closest('.row'), id = +r.dataset.id;
    if (b.dataset.act === 'open') { openAlbum(id); }
    else {
      arm(b, function () {
        var gone = trip(id);
        if (gone) gone.days.forEach(function (dd) { dropMedia(dd.clips); });
        S.trips = S.trips.filter(function (t) { return t.id !== id; });
        renderHome(); flush();
      });
    }
  });
  $('#addTrip').addEventListener('click', function () {
    S.trips.push(newTrip()); renderHome(); save();
    var rows = document.querySelectorAll('#rows .row');
    var last = rows[rows.length - 1];
    if (last) last.querySelector('textarea').focus();
  });

  /* ---------- 앨범 ---------- */
  function openAlbum(id) {
    cur = id; day = 0;
    show('album');
    renderAlbum();
  }
  function curTrip() { return cur == null ? null : trip(cur); }

  function renderAlbum() {
    var t = curTrip(); if (!t) { show('home'); return; }

    $('#stub').innerHTML = '<span class="l1">No. <b>' + idx + '</b> · <b>' + esc(place) + '</b></span>' + (t.date ? '<span class="l2">' + esc(t.date) + '</span>' : '');

        '<div class="thumb' + (c.kind === 'video' ? ' vid' : '') + '" role="button" tabindex="0" aria-label="' + (c.kind === 'video' ? '동영상 재생' : '사진 크게 보기') + '">' + (c.kind === 'video'

  /* ---------- 사진/동영상 크게 보기 ---------- */
  var viewerFrom = null;

  function readPhoto(file) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onerror = function () { rej(fr.error); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { rej(new Error('image')); };
        img.onload = function () {
          var s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.naturalWidth * s));
          c.height = Math.max(1, Math.round(img.naturalHeight * s));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(function (b) { if (b) res(b); else rej(new Error('blob')); }, 'image/jpeg', 0.82);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  $('#file').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    var t = curTrip(); if (!t || !files.length) return;
    var d = t.days[day], failed = 0, big = 0, pending = [];
    files.reduce(function (p, f) {
      return p.then(function () {
        var isVid = f.type.indexOf('video/') === 0;
        if (isVid && f.size > 300 * 1024 * 1024) { big++; return; }
        var prep = isVid ? Promise.resolve(f) : readPhoto(f);
        return prep.then(function (blob) {
          var id = S.nextId++, key = (isVid ? 'v' : 'p') + id;
          mediaUrls[key] = URL.createObjectURL(blob);
          if (canSave) pending.push(dbPut(key, blob));
          d.clips.push({ id: id, kind: isVid ? 'video' : 'photo', cap: '' });
        }).catch(function () { failed++; });
      });
    }, Promise.resolve()).then(function () {
      if (curTrip() === t) renderClips();
      return Promise.all(pending.map(function (q) { return q.catch(function () { warn(); }); }));
    }).then(function () {
      flush();
      if (failed) toast('파일 ' + failed + '개를 불러오지 못했어요. 사진은 JPG나 PNG로 시도해 주세요.');
      else if (big) toast('300MB보다 큰 동영상은 추가할 수 없어요.');
    });
  });

  /* ---------- 백업과 복원 (앱을 지우고 다시 설치해도 내용을 되살리기 위함) ---------- */
  var APP_VERSION = '1.4';
  var MIME_EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'video/mp4': 'mp4', 'video/quicktime': 'mov', 'video/webm': 'webm', 'video/x-m4v': 'm4v', 'video/3gpp': '3gp' };

  var CRC_T = (function () {

  }
  /* 압축 없이 담기만 하는 zip. 사진/동영상은 이미 압축돼 있어 크기 차이가 없고, 큰 파일도 메모리에 올리지 않고 처리한다. */

        h.setUint16(10, st.time, true); h.setUint16(12, st.date, true); h.setUint32(14, crc, true);
        h.setUint32(18, size, true); h.setUint32(22, size, true); h.setUint16(26, nb.length, true); h.setUint16(28, 0, true);
        parts.push(h.buffer, nb, e.blob);
        var c = new DataView(new ArrayBuffer(46));
        c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
        c.setUint16(12, st.time, true); c.setUint16(14, st.date, true); c.setUint32(16, crc, true);
        c.setUint32(20, size, true); c.setUint32(24, size, true); c.setUint16(28, nb.length, true);
        c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true);

    }, Promise.resolve()).then(function () {
      var z = new DataView(new ArrayBuffer(22));
      z.setUint32(0, 0x06054b50, true); z.setUint16(4, 0, true); z.setUint16(6, 0, true);
      z.setUint16(8, entries.length, true); z.setUint16(10, entries.length, true);

      return blob.slice(cdOff, cdOff + cdSize).arrayBuffer().then(function (cb) {
        var cd = new DataView(cb), u8 = new Uint8Array(cb), pos = 0, list = [], dec = new TextDecoder();
        for (var n = 0; n < count; n++) {
          if (cd.getUint32(pos, true) !== 0x02014b50) throw new Error('zip');
          var method = cd.getUint16(pos + 10, true), size = cd.getUint32(pos + 24, true);
          var nl = cd.getUint16(pos + 28, true), el = cd.getUint16(pos + 30, true), cl = cd.getUint16(pos + 32, true), off = cd.getUint32(pos + 42, true);
          if (method !== 0) throw new Error('method');

          pos += 46 + nl + el + cl;

            var h = new DataView(hb), start = e.off + 30 + h.getUint16(26, true) + h.getUint16(28, true);

      });

  }
  /* zip:end */

  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDate(ts) { var d = new Date(ts); return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '. ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  function fmtSize(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }
  function allClips() {
    var out = [];
    S.trips.forEach(function (t) { t.days.forEach(function (d) { d.clips.forEach(function (c) { if (c.kind === 'photo' || c.kind === 'video') out.push(c); }); }); });
    return out;
  }
  function blobFor(key) {
    return dbGet(key).catch(function () { return null; }).then(function (b) {
      if (b) return b;
      return mediaUrls[key] ? fetch(mediaUrls[key]).then(function (r) { return r.blob(); }).catch(function () { return null; }) : null;
    });
  }

  var dlgBlob = null, dlgName = '', restoreData = null;
  function updateDot() {
    var dot = $('#menuDot'); if (!dot || !S) return;
    dot.hidden = !(S.changedAt && (!S.backupAt || S.changedAt > S.backupAt));
  }
  function setMsg(t) { $('#dlgMsg').textContent = t || ''; }
  function dlgRender(mode) {
    var info = $('#dlgInfo'), box = $('#dlgActions');
    function btn(act, label, cls) { return '<button type="button" class="btn ' + (cls || '') + '" data-act="' + act + '">' + label + '</button>'; }
    if (mode === 'busy') { info.textContent = ''; box.innerHTML = ''; return; }
    if (mode === 'ready') {
      info.textContent = '백업 파일이 준비됐어요 (' + fmtSize(dlgBlob.size) + ').';
      box.innerHTML = btn('save', '저장하기') + btn('back', '뒤로', 'ghost');
      setMsg('저장하기를 누르면 나오는 창에서 "파일에 저장"처럼 보관할 위치를 골라 주세요.');
      return;
    }
    if (mode === 'confirm') {
      var m = restoreData.meta;
      info.textContent = '여행 ' + m.state.trips.length + '개, 사진/동영상 ' + (m.media || []).length + '개 (백업한 때: ' + fmtDate(m.savedAt) + ')';
      box.innerHTML = btn('apply', '이 백업으로 바꾸기', 'danger') + btn('back', '취소', 'ghost');
      setMsg('불러오면 지금 들어 있는 내용은 이 백업 내용으로 바뀌어요.');
      return;
    }
    info.textContent = S.backupAt ? '마지막 백업: ' + fmtDate(S.backupAt) : '아직 백업한 적이 없어요.';
    box.innerHTML = btn('make', '백업 파일 만들기') + btn('pick', '백업 파일 불러오기', 'ghost');
  }
  function openDlg() {
    $('#dlgVer').textContent = APP_VERSION;
    dlgBlob = null; restoreData = null;
    dlgRender('main'); setMsg('');
    $('#dlg').hidden = false;
    $('#dlgClose').focus();
  }
  function closeDlg() {
    var d = $('#dlg'); if (!d || d.hidden) return;
    d.hidden = true; dlgBlob = null; restoreData = null;
  }

  function makeBackup() {
    var clips = allClips(), media = [], entries = [], done = 0;
    dlgRender('busy'); setMsg('백업 파일을 만드는 중이에요…');
    clips.reduce(function (p, c) {
      return p.then(function () {
        var key = mkey(c);
        return blobFor(key).then(function (blob) {
          if (blob) {
            var type = blob.type || (c.kind === 'video' ? 'video/mp4' : 'image/jpeg');
            var file = 'media/' + key + '.' + (MIME_EXT[type] || (c.kind === 'video' ? 'mp4' : 'jpg'));
            media.push({ key: key, file: file, type: type });
            entries.push({ name: file, blob: blob });
          }
          done++; setMsg('사진/동영상 담는 중… ' + done + '/' + clips.length);
        });
      });
    }, Promise.resolve()).then(function () {
      var meta = { app: 'pennys-trip', format: 1, appVersion: APP_VERSION, savedAt: Date.now(), state: S, media: media };
      entries.unshift({ name: 'data.json', blob: new Blob([JSON.stringify(meta)], { type: 'application/json' }) });
      setMsg('파일로 묶는 중이에요. 큰 동영상이 있으면 시간이 걸려요…');
      return zipBuild(entries);
    }).then(function (zip) {
      var d = new Date();
      dlgBlob = zip;
      dlgName = 'pennys-trip-backup-' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()) + '.zip';
      dlgRender('ready');
    }).catch(function () {
      dlgRender('main'); setMsg('백업 파일을 만들지 못했어요. 폰의 저장 공간을 확인한 뒤 다시 시도해 주세요.');
    });
  }

  function deliverBackup() {
    if (!dlgBlob) return;
    var blob = dlgBlob, name = dlgName, file = new File([blob], name, { type: 'application/zip' });
    function finish() {
      S.backupAt = Date.now(); flush(); updateDot();
      dlgBlob = null; dlgRender('main'); setMsg('백업 파일을 저장했어요.');
    }
    function download() {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
      finish();
    }
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).then(finish).catch(function (e) {
        if (e && e.name === 'AbortError') { setMsg('저장을 취소했어요. 다시 누르면 저장할 수 있어요.'); return; }
        download();
      });
    } else download();
  }

  function applyRestore() {
    var r = restoreData; if (!r) return;
    if (!canSave) { setMsg('이 브라우저에서는 저장이 안 돼서 불러올 수 없어요.'); return; }
    var list = r.meta.media || [], done = 0, newKeys = {};
    var oldKeys = allClips().map(mkey);
    dlgRender('busy'); setMsg('불러오는 중이에요…');

      return p.then(function () {

      });

      return Promise.all(oldKeys.filter(function (k) { return !newKeys[k]; }).map(function (k) { return dbDel(k).catch(function () {}); }));
    }).then(function () {
      restoreData = null;
      renderHome(); show('home'); closeDlg(); toast('백업 내용을 불러왔어요.');
    }).catch(function () {
      dlgRender('main'); setMsg('불러오지 못했어요. 폰의 저장 공간이 부족할 수 있어요.');
    });
  }

  $('#menuBtn').addEventListener('click', openDlg);
  $('#dlgClose').addEventListener('click', closeDlg);
  $('#dlg').addEventListener('click', function (e) { if (e.target.id === 'dlg') closeDlg(); });
  $('#dlgActions').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var act = b.dataset.act;
    if (act === 'make') makeBackup();
    else if (act === 'save') deliverBackup();
    else if (act === 'pick') $('#restoreFile').click();
    else if (act === 'apply') applyRestore();
    else if (act === 'back') { dlgBlob = null; restoreData = null; dlgRender('main'); setMsg(''); }
  });
  $('#restoreFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    dlgRender('busy'); setMsg('백업 파일을 확인하는 중이에요…');
    zipRead(f).then(function (z) {
      if (!z['data.json']) throw new Error('bad');
      return z['data.json'].text().then(function (txt) {
        var meta = JSON.parse(txt);
        if (meta.app !== 'pennys-trip' || !meta.state || !Array.isArray(meta.state.trips)) throw new Error('bad');
        restoreData = { meta: meta, zip: z };
        dlgRender('confirm');
      });
    }).catch(function (err) {
      dlgRender('main');
      setMsg(err && err.message === 'method'
        ? '압축 방식이 달라서 읽을 수 없어요. 저장해 둔 백업 파일을 다시 압축하지 말고 그대로 선택해 주세요.'
        : 'Penny\'s Trip 백업 파일이 아니에요. 저장해 둔 백업 파일(.zip)을 선택해 주세요.');
    });
  });

  /* ---------- 시작 ---------- */
  function boot() {
    var timedOut = false;
    var wait = new Promise(function (r) { setTimeout(function () { timedOut = true; r(null); }, 3000); });
    var load;
    try { load = dbGet('state'); } catch (e) { load = Promise.resolve(null); }
    Promise.race([load.catch(function () { canSave = false; return null; }), wait]).then(function (v) {
      if (timedOut) canSave = false;
      var upgraded = !!(v && v.schema !== SCHEMA);
      S = migrate(v) || seed();
      S.trips.forEach(function (t) { if (t.date === '10.14 – 10.17') { t.date = '2026. 10. 16. ~ 10. 18.'; save(); } });
      renderHome();
      if (upgraded && canSave) save();
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    });
  }
  boot();
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
